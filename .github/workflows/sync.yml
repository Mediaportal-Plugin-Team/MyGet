name: Mirror MyGet V3 to GitHub Packages

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight

jobs:
  mirror:
    name: 🔄 Mirror MyGet to GitHub
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: 🛠️ Install GPR tool
        run: dotnet tool install gpr -g

      - name: 🚀 Mirror Packages from V3 Feed
        run: |
          # Configuration
          $indexUrl = "https://www.myget.org/F/mediaportal/api/v3/index.json"
          $repoUrl = "https://github.com/Mediaportal-Plugin-Team/MyGet"
          
          # 1. Fetch the Search Service URL with retries
          $maxRetries = 3
          $retryCount = 0
          $index = $null

          while ($null -eq $index -and $retryCount -lt $maxRetries) {
              try {
                  $response = Invoke-WebRequest -Uri $indexUrl -UseBasicParsing -ErrorAction Stop
                  if ($response.Headers["Content-Type"] -like "*json*") {
                      $index = $response.Content | ConvertFrom-Json
                  } else {
                      throw "Server returned HTML instead of JSON. MyGet might be down."
                  }
              }
              catch {
                  $retryCount++
                  Write-Host "⚠️ Attempt $retryCount failed to reach MyGet. Retrying in 5 seconds..."
                  Start-Sleep -Seconds 5
              }
          }

          if ($null -eq $index) {
              Write-Error "❌ MyGet is currently unavailable or returning errors. Please try again later."
              exit 1
          }

          $searchUrl = ($index.resources | Where-Object { $_.'@type' -eq 'SearchQueryService' }).'@id'

          Write-Host "Searching packages at $searchUrl..."

          # 2. Get the list of packages with retries
          $retryCount = 0
          $searchResponse = $null

          while ($null -eq $searchResponse -and $retryCount -lt $maxRetries) {
              try {
                  $response = Invoke-WebRequest -Uri "$($searchUrl)?take=100" -UseBasicParsing -ErrorAction Stop
                  if ($response.Headers["Content-Type"] -like "*json*") {
                      $searchResponse = $response.Content | ConvertFrom-Json
                  } else {
                      throw "Server returned HTML instead of JSON during search."
                  }
              }
              catch {
                  $retryCount++
                  Write-Host "⚠️ Search attempt $retryCount failed. Retrying in 5 seconds..."
                  Start-Sleep -Seconds 5
              }
          }

          if ($null -eq $searchResponse) {
              Write-Error "❌ Failed to get package list from MyGet after multiple attempts."
              exit 1
          }
                    
          foreach ($pkg in $searchResponse.data) {
              $pkgId = $pkg.id
              $version = $pkg.version

              $idLow = $pkgId.ToLower()
              $verLow = $version.ToLower()

              # Check if package already exists in GitHub Packages
              $ghPackageUrl = "https://nuget.pkg.github.com/Mediaportal-Plugin-Team/${idLow}/${verLow}/${idLow}.${verLow}.nupkg"
              $exists = $false
              try {
                  $check = Invoke-WebRequest -Uri $ghPackageUrl -Method Head -Headers @{"Authorization" = "Bearer ${{ secrets.GITHUB_TOKEN }}"} -ErrorAction SilentlyContinue
                  if ($check.StatusCode -eq 200) { $exists = $true }
              } catch { $exists = $false }

              if ($exists) {
                  Write-Host "⏭️ Skipping ${pkgId} (${version}) - already exists in GitHub."
                  continue
              }

              # Safe string formatting for the download URL
              $baseDownloadUrl = "https://www.myget.org/F/mediaportal/api/v3/flatcontainer"
              $downloadUrl = "${baseDownloadUrl}/${idLow}/${verLow}/${idLow}.${verLow}.nupkg"
              
              $fileName = "${pkgId}.${version}.nupkg"

              Write-Host "---"
              Write-Host "Processing: ${pkgId} (Version: ${version})"
              Write-Host "Download URL: ${downloadUrl}"
              
              try {
                  # Download the package
                  Invoke-WebRequest -Uri $downloadUrl -OutFile $fileName -ErrorAction Stop
                  
                  # Push to GitHub Packages
                  gpr push $fileName -k ${{ secrets.GITHUB_TOKEN }} --repository $repoUrl
                  Write-Host "Successfully mirrored: ${pkgId}"
              }
              catch {
                  # Check if error is just a duplicate package (HTTP 409 or similar)
                  Write-Host "Warning: Could not process ${pkgId}. It might already exist or source is unavailable. Error: ${_}"
              }
              finally {
                  if (Test-Path $fileName) { Remove-Item $fileName }
              }
          }
        shell: pwsh
