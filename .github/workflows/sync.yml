name: Mirror MyGet V3 to GitHub Packages

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight

jobs:
  mirror:
    name: 🔄 Mirror MyGet to GitHub
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: 🚀 Mirror Packages from V3 Feed
        run: |
          # Configuration
          $indexUrl = "https://www.myget.org/F/mediaportal/api/v3/index.json"
          $baseDownloadUrl = "https://www.myget.org/F/mediaportal/api/v3/flatcontainer"
          $ghSrcBase = "https://nuget.pkg.github.com/Mediaportal-Plugin-Team"
          $ghSrc = "${ghSrcBase}/index.json"
          $repoUrl = "https://github.com/Mediaportal-Plugin-Team/MyGet"
          
          # 1. Fetch the Search Service URL with retries
          $maxRetries = 3
          $retryCount = 0
          $index = $null

          while ($null -eq $index -and $retryCount -lt $maxRetries) {
              try {
                  $response = Invoke-WebRequest -Uri $indexUrl -UseBasicParsing -ErrorAction Stop
                  if ($response.Headers["Content-Type"] -like "*json*") {
                      $index = $response.Content | ConvertFrom-Json
                  } else {
                      throw "Server returned HTML instead of JSON. MyGet might be down."
                  }
              }
              catch {
                  $retryCount++
                  Write-Host "⚠️ Attempt $retryCount failed to reach MyGet. Retrying in 5 seconds..."
                  Start-Sleep -Seconds 5
              }
          }

          if ($null -eq $index) {
              Write-Error "❌ MyGet is currently unavailable or returning errors. Please try again later."
              exit 1
          }

          $searchUrl = ($index.resources | Where-Object { $_.'@type' -eq 'SearchQueryService' }).'@id'

          Write-Host "📡 Searching packages at $searchUrl..."

          # 2. Get the list of ALL verified packages (pagination + retries)
          $verifiedPackages = @()
          $skip = 0
          $take = 100
          $allPagesFetched = $false

          while (-not $allPagesFetched) {
              $retryCount = 0
              $pageResponse = $null

              while ($null -eq $pageResponse -and $retryCount -lt $maxRetries) {
                  try {
                      Write-Host "📡 Fetching packages (skip=$skip, take=$take)..."
                      $response = Invoke-WebRequest -Uri "$($searchUrl)?take=$take&skip=$skip" -UseBasicParsing -ErrorAction Stop
                      if ($response.Headers["Content-Type"] -like "*json*") {
                          $pageResponse = $response.Content | ConvertFrom-Json
                      } else {
                          throw "Server returned HTML instead of JSON."
                      }
                  }
                  catch {
                      $retryCount++
                      Write-Host "⚠️ Attempt $retryCount failed. Retrying in 5 seconds..."
                      Start-Sleep -Seconds 5
                  }
              }

              if ($null -eq $pageResponse) {
                  Write-Error "❌ Failed to fetch page at skip=$skip. Exiting."
                  exit 1
              }

              if ($pageResponse.data.Count -eq 0) {
                  $allPagesFetched = $true
              } else {
                  $verifiedOnPage = $pageResponse.data | Where-Object { $_.verified -eq $true }
                  $verifiedPackages += $verifiedOnPage
                  $skip += $take
              }
          }

          Write-Host "✅ Total verified packages found: $($verifiedPackages.Count)"
          
          foreach ($pkg in $verifiedPackages) {
              $pkgId = $pkg.id
              $version = $pkg.version

              $idLow = $pkgId.ToLower()
              $verLow = $version.ToLower()

              Write-Host "---"
              Write-Host "🚀 Processing: ${pkgId} (Version: ${version})"

              # 3. Download the package
              $downloadUrl = "${baseDownloadUrl}/${idLow}/${verLow}/${idLow}.${verLow}.nupkg"
              $fileName = "${pkgId}.${version}.nupkg"
              Write-Host "📡 Download URL: ${downloadUrl}"
              
              try {
                  Invoke-WebRequest -Uri $downloadUrl -OutFile $fileName -ErrorAction Stop
              } catch {
                  Write-Host "⚠️ Warning: Failed to download ${pkgId}. Skipping..."
                  continue
              }                  

              # 4. Push to GitHub Packages
              try {
                  # Using --skip-duplicate to avoid errors if version already exists
                  # Output is captured to provide cleaner logs
                  $pushOutput = dotnet nuget push $fileName `
                      --source $ghSrc `
                      --api-key ${{ secrets.GITHUB_TOKEN }} `
                      --skip-duplicate 2>&1
    
                  if ($pushOutput -match "already exists") {
                      Write-Host "⏭️  Result: Already on GitHub. Skipped."
                  } elseif ($pushOutput -match "Your package was pushed") {
                      Write-Host "✅ Result: Successfully mirrored!"
                  } else {
                      Write-Host "❌ Result: Push failed with error:"
                      Write-Host $pushOutput
                  }
              }
              catch {
                  Write-Host "⚠️ Warning: Standard push failed for ${pkgId}. This often happens if the package lacks a 'repository' field in its nuspec."
                  Write-Host "Error details: ${_}"
              }
              finally {
                  if (Test-Path $fileName) { Remove-Item $fileName }
              }

              # Delay to prevent rate limiting
              Start-Sleep -Milliseconds 500
          }
        shell: pwsh
