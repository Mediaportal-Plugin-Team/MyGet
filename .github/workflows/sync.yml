name: Mirror MyGet V3 to GitHub Packages

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight

jobs:
  mirror:
    name: 🔄 Mirror MyGet to GitHub
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: 🛠️ Install GPR tool
        run: dotnet tool install gpr -g

      - name: 🚀 Mirror Packages from V3 Feed
        run: |
          # Configuration
          $indexUrl = "https://www.myget.org/F/mediaportal/api/v3/index.json"
          $repoUrl = "https://github.com/Mediaportal-Plugin-Team/MyGet"
          
          # 1. Fetch the Search Service URL
          $index = Invoke-RestMethod -Uri $indexUrl
          $searchUrl = ($index.resources | Where-Object { $_.'@type' -eq 'SearchQueryService' }).'@id'

          Write-Host "Searching packages at $searchUrl..."

          # 2. Get the list of packages
          $searchResponse = Invoke-RestMethod -Uri "$($searchUrl)?take=100"
          
          foreach ($pkg in $searchResponse.data) {
              $pkgId = $pkg.id
              $version = $pkg.version
              
              # Safe string formatting for the download URL
              $idLower = $pkgId.ToLower()
              $verLower = $version.ToLower()
              $baseDownloadUrl = "https://www.myget.org/F/mediaportal/api/v3/flatcontainer"
              $downloadUrl = "${baseDownloadUrl}/${idLower}/${verLower}/${idLower}.${verLower}.nupkg"
              
              $fileName = "${pkgId}.${version}.nupkg"

              Write-Host "---"
              Write-Host "Processing: ${pkgId} (Version: ${version})"
              Write-Host "Download URL: ${downloadUrl}"
              
              try {
                  # Download the package
                  Invoke-WebRequest -Uri $downloadUrl -OutFile $fileName -ErrorAction Stop
                  
                  # Push to GitHub Packages
                  gpr push $fileName -k ${{ secrets.GITHUB_TOKEN }} --repository $repoUrl
                  Write-Host "Successfully mirrored: ${pkgId}"
              }
              catch {
                  # Check if error is just a duplicate package (HTTP 409 or similar)
                  Write-Host "Warning: Could not process ${pkgId}. It might already exist or source is unavailable. Error: ${_}"
              }
              finally {
                  if (Test-Path $fileName) { Remove-Item $fileName }
              }
          }
        shell: pwsh
